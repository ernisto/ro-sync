name: Release
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  publish_pesde:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - name: Sync version
        run: lute run scripts/bump_version

      - uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}

      - run: pesde auth login --token "${{ secrets.PESDE_AUTH }}"
        env:
          PESDE_AUTH: ${{ secrets.PESDE_AUTH }}

      - run: pesde publish -y

  publish_binaries:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}

      - uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
      - run: pesde install

      - name: Bundle
        run: darklua process cli/init.luau dist/ro-sync.luau

      - name: Build
        run: |
          for target in {windows,linux,macos}-{x86_64,aarch64}; do
            ext=""; [[ $target == windows-* ]] && ext=".exe"
            mkdir -p "dist/$target"
            lune build dist/ro-sync.luau -t "$target" -o "dist/$target/ro-sync$ext"
            (cd "dist/$target" && zip "../ro-sync-${{ github.event.release.tag_name }}-$target.zip" "ro-sync$ext")
          done

      - name: Upload
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
