name = "ernisto/ro_sync"
version = "0.0.0-alpha.0"
license = "MIT"
includes = [
  "utils/**",
  "cli/**",
  "lib/**",
  "pesde.toml",
  "README.md",
  "LICENSE",
  ".luaurc",
]

[target]
environment = "lune"
lib = "lib/init.luau"
bin = "cli/init.luau"

[engines]
pesde = "^0.7.4"
lune = "^0.10.5"

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
ro_cloud = { name = "ernisto/ro_cloud", version = "=0.1.0-beta.1", target = "luau" }
